[package]
name = "street-x64dbg"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "x64dbg plugin: menus, command set, native decompile at CIP"

[lib]
name = "street_x64dbg"
crate-type = ["cdylib", "rlib"]

[dependencies]
street-core = { path = "../street-core" }
street-disasm = { path = "../street-disasm" }
street-lift = { path = "../street-lift" }
street-decompile = { path = "../street-decompile" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }
