[workspace]
resolver = "2"
members = [
    "crates/street-core",
    "crates/street-disasm",
    "crates/street-lift",
    "crates/street-decompile",
    "crates/street-crypto",
    "crates/street-ir",
    "crates/street-links",
    "crates/street-kernel",
    "crates/street-debug",
    "crates/street-project",
    "crates/street-session",
    "crates/street-mcp",
    "crates/street-x64dbg",
    "crates/street-cli",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["Kovak"]
repository = "file:///D:/Street-decrepytor-rs"
description = "Street — one-process debugger + native C motor + kernel + auto-links"

[workspace.dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "nasm", "instr_info"] }
object = { version = "0.36", default-features = false, features = ["read", "pe", "elf", "coff", "archive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
ratatui = "0.29"
crossterm = "0.28"

[workspace.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_WindowsProgramming",
    "Win32_System_Kernel",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
