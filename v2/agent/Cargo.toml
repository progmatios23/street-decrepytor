[package]
name    = "street-agent"
version = "2.0.0"
edition = "2021"
authors = ["Street-Decryptor v2"]

[[bin]]
name = "street-agent"
path = "src/main.rs"

[dependencies]
# Windows API bindings — full surface
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_IO",
    "Win32_Security",
] }

ntapi   = "0.4"          # NT native functions (NtReadVirtualMemory, NtQueryInformationProcess)
serde   = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow  = "1"
clap    = { version = "4", features = ["derive"] }
log     = "0.4"
env_logger = "0.11"
sha2    = "0.10"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
